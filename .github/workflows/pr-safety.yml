name: PR Safety Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # GitHub Advanced Security is required for this action on private repos.
      # Until GHAS is enabled the action errors out, so warn-only by default.
      # Set repo variable DEPENDENCY_REVIEW_ENFORCE=true (Settings → Variables)
      # to flip this to blocking once GHAS is on — no workflow edit needed.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        continue-on-error: ${{ vars.DEPENDENCY_REVIEW_ENFORCE != 'true' }}
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Blocks the PR on any HIGH or CRITICAL prod advisory that
        # isn't in the allowlist below. Matches the previous
        # `npm audit --audit-level=high` behaviour, which fails on
        # both severities. Each allowlist entry pairs a GHSA with
        # a one-line rationale so a future reviewer can revisit
        # whether it still deserves the pass.
        #
        # Adding entries here is a stopgap: it unblocks CI when an
        # advisory is either not applicable to Wanderline's code
        # paths OR is tracked under a separate remediation ticket
        # that's slated for its own PR. Prefer removing entries
        # over adding them; every entry should have a tracked way
        # to disappear.
        run: |
          set -euo pipefail

          # GHSA IDs to skip. Lines starting with `#` and blank
          # lines are ignored; every other line is treated as a
          # GHSA. Do not put anything else on the GHSA lines.
          ALLOWLIST=$(cat <<'ALLOW'
          # react-router / react-router-dom RSC Mode CSRF Bypass.
          # Not applicable: we do not use React Server Components,
          # so the vulnerable `handleAction` path never runs in
          # this app. The v7 line has no patch; upgrading to v8
          # requires React 19 first (task #233). Remove this line
          # once the React 19 + react-router 8 upgrade lands.
          GHSA-qwww-vcr4-c8h2

          # brace-expansion DoS via exponential-time expansion.
          # Transitive via minimatch/glob. No untrusted input reaches
          # these expansion paths in Wanderline's runtime, but the
          # full analysis + upgrade lives in the follow-up dep-sweep
          # ticket rather than this PR. Remove after that ticket
          # lands the patched versions across the tree.
          GHSA-3jxr-9vmj-r5cp

          # brace-expansion DoS via unbounded expansion length (OOM).
          # CVE-2026-14257. Same transitive story as GHSA-3jxr; patched
          # in 5.0.8. Handled by the same dep-sweep ticket.
          GHSA-mh99-v99m-4gvg

          # fast-uri host confusion via literal backslash / IDN.
          # Same story: transitive via fast-xml-parser and friends,
          # bump lands in the dep-sweep ticket.
          GHSA-v2hh-gcrm-f6hx
          GHSA-4c8g-83qw-93j6

          # fast-uri host confusion via backslash authority
          # introducer. Third fast-uri advisory in the same family;
          # same transitive scope, same dep-sweep ticket.
          GHSA-7p8r-x3mc-p8w7

          # brace-expansion DoS via unbounded intermediate arrays
          # (bypasses the CVE-2026-14257 mitigation we already
          # allowlisted). Same transitive story as the earlier
          # brace-expansion entries; patched across all four
          # majors and lands with the dep-sweep ticket.
          GHSA-rgw5-rvv9-x895

          # ip-address advisories (three of them). Reaches us
          # transitively via express-rate-limit, which uses
          # ip-address ONLY to normalise IPv6 clients for
          # rate-limit key bucketing. It does not take user-
          # supplied URLs / hostnames and dereference them, so
          # the SSRF and trust-boundary bypass scenarios in these
          # advisories are not reachable through Wanderline's
          # code paths. Bump piggybacks on the dep-sweep ticket.
          # - GHSA-22jq-vg5j-6vgg: NAT64 misclassification (10.2.1)
          # - GHSA-4xrf-jv44-h6hh: CIDR suffix bypass (10.2.2)
          # - GHSA-mwp4-54f8-5fhr: octal-vs-decimal leading zeros (10.3.1)
          GHSA-22jq-vg5j-6vgg
          GHSA-4xrf-jv44-h6hh
          GHSA-mwp4-54f8-5fhr
          ALLOW
          )
          # Filter comments (leading whitespace + `#`) and blank
          # lines with POSIX-compatible expressions; grep's `\s`
          # only works under -P/PCRE and isn't portable. `xargs -n 1
          # echo` trims and one-per-line normalises what's left.
          IGNORED=$(echo "$ALLOWLIST" | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' | xargs -n 1 echo || true)

          # Collect every HIGH+CRITICAL advisory URL from the audit
          # report. Matches the semantics of `npm audit
          # --audit-level=high` (which is inclusive of critical).
          npm audit --json --omit=dev > audit.json || true
          BLOCKING=$(jq -r '
            [.vulnerabilities[]?
              | select(.severity == "high" or .severity == "critical")
              | .via[]?
              | select(type == "object")
              | .url]
            | unique
            | .[]
          ' audit.json)

          # Strip out allowlisted GHSAs.
          UNRESOLVED=""
          for url in $BLOCKING; do
            ghsa=$(echo "$url" | grep -oE 'GHSA-[a-z0-9-]+' || true)
            if [ -n "$ghsa" ] && echo "$IGNORED" | grep -qx "$ghsa"; then
              continue
            fi
            UNRESOLVED="$UNRESOLVED $url"
          done

          if [ -n "$(echo "$UNRESOLVED" | xargs)" ]; then
            echo "::error::Unresolved HIGH/CRITICAL advisories:"
            for url in $UNRESOLVED; do
              echo "  - $url"
            done
            echo ""
            echo "Fix the advisory (bump the dep) or, if intentionally"
            echo "deferred, add the GHSA to ALLOWLIST above with a"
            echo "one-line rationale."
            exit 1
          fi

          echo "No unresolved HIGH/CRITICAL prod advisories."

  check-secrets:
    name: Check for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR diff for secret files
        run: |
          # Get list of files changed in this PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Patterns that indicate secrets or credentials
          PATTERNS='\.env$|\.env\.local|\.env\.prod|\.env\.staging|credentials\.json|\.pem$|\.key$|id_rsa|\.secret$'

          # Find matching files, excluding template files like .example and .template
          MATCHES=$(echo "$CHANGED_FILES" | grep -iE "$PATTERNS" | grep -ivE '\.(example|template|sample)$' || true)

          if [ -n "$MATCHES" ]; then
            echo "::error::Potential secret or credential files detected in this PR:"
            echo ""
            echo "$MATCHES" | while read -r file; do
              echo "  - $file"
            done
            echo ""
            echo "If these files are intentional (e.g., .env.example), update the check pattern."
            echo "Otherwise, remove them from the commit and add them to .gitignore."
            exit 1
          fi

          echo "No secret files detected."

  check-large-files:
    name: Check for Large Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for files exceeding 1MB
        run: |
          # Get added or modified files in this PR
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD)

          OVERSIZED=""
          for file in $CHANGED_FILES; do
            # Skip if file was deleted or doesn't exist
            [ ! -f "$file" ] && continue

            # Get file size in bytes
            SIZE=$(stat --format=%s "$file")
            MAX_SIZE=1048576  # 1MB in bytes

            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
              OVERSIZED="${OVERSIZED}  - ${file} (${SIZE_MB} MB)\n"
            fi
          done

          if [ -n "$OVERSIZED" ]; then
            echo "::error::Files exceeding 1MB detected:"
            echo ""
            echo -e "$OVERSIZED"
            echo "Large binary files should not be committed to the repository."
            echo "Consider using Git LFS or hosting the file externally."
            exit 1
          fi

          echo "No oversized files detected."
